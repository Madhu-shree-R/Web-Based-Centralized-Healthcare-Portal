<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" href="Error/pic.jpg" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../vendor/css/custom.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="AdminHome.jsp">Doctor+ Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="d-flex">
    <div id="sidebar" class="bg-light p-3 min-vh-100">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/user-details}"><i class="fas fa-users"></i> User Details</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/appointments}"><i class="fas fa-calendar"></i> Appointments</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/doctor-details}"><i class="fas fa-user-md"></i> Doctor Details</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/admin-details}"><i class="fas fa-user-shield"></i> Admin Details</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/add-doctor}"><i class="fas fa-user-plus"></i> Add Doctor</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/add-admin}"><i class="fas fa-user-shield"></i> Add Admin</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/edit-my-profile}"><i class="fas fa-user-edit"></i> My Profile</a></li>
        </ul>
    </div>

    <div class="container mt-4">
        <h3 class="mb-4">Add Admin</h3>
        <form th:action="@{/admin/save-admin}" th:object="${doctor}" method="POST">
            <div class="mb-3">
                <label class="form-label">First Name:</label>
                <input type="text" th:field="*{firstName}" class="form-control" required placeholder="First Name">
            </div>
            <div class="mb-3">
                <label class="form-label">Last Name:</label>
                <input type="text" th:field="*{lastName}" class="form-control" required placeholder="Last Name">
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required placeholder="Email">
            </div>
            <div class="mb-3">
                <label class="form-label">Gender:</label>
                <select th:field="*{gender}" class="form-control" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
