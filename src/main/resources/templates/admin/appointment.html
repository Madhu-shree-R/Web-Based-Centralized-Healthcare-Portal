<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="Error/pic.jpg" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../vendor/css/custom.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="AdminHome.jsp">Doctor+ Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="d-flex">
    <div id="sidebar" class="bg-light p-3 min-vh-100">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/user-details}"><i class="fas fa-users"></i> User Details</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/admin/appointments}"><i class="fas fa-calendar"></i> Appointments</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/doctor-details}"><i class="fas fa-user-md"></i> Doctor Details</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/admin-details}"><i class="fas fa-user-shield"></i> Admin Details</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/add-doctor}"><i class="fas fa-user-plus"></i> Add Doctor</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/add-admin}"><i class="fas fa-user-shield"></i> Add Admin</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/edit-my-profile}"><i class="fas fa-user-edit"></i> My Profile</a></li>
        </ul>
    </div>

    <div class="container mt-4">
        <h3 class="mb-4">Appointments List</h3>
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Approval Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td th:text="${appointment.id}"></td>
                            <td th:text="${appointment.name}"></td>
                            <td th:text="${appointment.email}"></td>
                            <td th:text="${appointment.date}"></td>
                            <td th:text="${appointment.time}"></td>
                            <td th:text="${appointment.approvalStatus}"></td>
                            <td>
                                <a class="btn btn-success btn-sm" th:href="@{/admin/approve-appointment/{id}(id=${appointment.id})}">Approve</a>
                                <a class="btn btn-danger btn-sm" th:href="@{/admin/reject-appointment/{id}(id=${appointment.id})}">Reject</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
