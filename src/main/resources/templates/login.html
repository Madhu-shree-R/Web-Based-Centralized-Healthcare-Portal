<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login</title>

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

	<!-- Custom Styles -->
	<style>
		body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #667eea;
        }
        .btn-primary {
            background-color: #667eea;
            border: none;
        }
        .btn-primary:hover {
            background-color: #564b93;
        }
	</style>
</head>

<body>
<div class="login-container text-center">
	<h3 class="mb-3">User, Doctor & Admin Login</h3>
	<form th:action="@{/authenticateTheUser}" method="POST">

		<div class="mb-3">
			<label class="form-label">Email</label>
			<input type="text" name="username" class="form-control" placeholder="Enter your email" required>
		</div>

		<div class="mb-3">
			<label class="form-label">Password</label>
			<input type="password" name="password" class="form-control" placeholder="Enter your password" required>
		</div>

		<button type="submit" class="btn btn-primary w-100">Login</button>

		<div th:if="${param.error}" class="alert alert-danger mt-3">Wrong username/password</div>
		<div th:if="${param.logout}" class="alert alert-success mt-3">You have logged out successfully</div>
	</form>

	<div class="mt-3">
		<span>Not a member? <a th:href="@{/register}" class="text-primary">Sign up now</a></span>
	</div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
