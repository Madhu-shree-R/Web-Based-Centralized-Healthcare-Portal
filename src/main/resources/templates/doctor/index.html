<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Doctor Dashboard">
    <meta name="author" content="Hau Nguyen">
    <meta name="keywords" content="doctor dashboard template">

    <!-- Title Page-->
    <title>Doctor Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../doctor/css/custom.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="DoctorHome.jsp">Doctor+ Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar" class="bg-light p-3 min-vh-100">
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" th:href="@{/doctor/index}"><i class="fas fa-table"></i> Appointments</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container mt-4">
        <h3 class="mb-4">Appointments List</h3>

        <div class="card mb-3">
            <div class="card-header">
                <i class="fas fa-table"></i> Appointments List
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Approval Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${appointments}">
                            <td th:text="${appointment.id}"></td>
                            <td th:text="${appointment.name}"></td>
                            <td th:text="${appointment.email}"></td>
                            <td th:text="${appointment.date}"></td>
                            <td th:text="${appointment.time}"></td>
                            <td th:text="${appointment.approvalStatus}"></td>
                            <td>
                                <a class="btn btn-success btn-sm" th:href="@{/doctor/approve-appointment/{id}(id=${appointment.id})}">
                                    Approve
                                </a>
                                <a class="btn btn-danger btn-sm" th:href="@{/doctor/reject-appointment/{id}(id=${appointment.id})}">
                                    Reject
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
