<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Your Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Body background with animation */
    body {
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      animation: fadeIn 1.5s ease-in-out;
    }

    /* Card container with animation */
    .card {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      animation: slideUp 1s ease-in-out;
    }

    /* Password strength progress bar animation */
    .progress {
      height: 10px;
      border-radius: 5px;
      transition: all 0.5s ease;
    }

    /* Invalid input field styling */
    .is-invalid {
      border-color: #dc3545;
    }

    /* Link hover effect */
    .login-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      transition: color 0.3s ease;
    }

    .login-link:hover {
      color: #007bff;
    }

    /* Keyframe animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
<div class="card p-4" style="width: 400px;">
  <h4 class="text-center">Set Your Password</h4>
  <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text=${successMessage}></div>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text=${errorMessage}></div>
  <div th:if="${invalidToken}" class="alert alert-danger" role="alert" th:text=${invalidToken}></div>

  <form th:if="!${invalidToken}" id="passwordForm" role="form" action="#" th:object="${setPassword}" th:action="@{/confirm}" method="post">
    <input type="hidden" name="token" th:value=${confirmationToken}>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input name="password" type="password" id="password" class="form-control" placeholder="Enter password" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" name="ConfirmPassword" required />
      <div class="invalid-feedback">Passwords must match</div>
    </div>

    <div class="progress mb-3">
      <div id="strengthBar" class="progress-bar" role="progressbar"></div>
    </div>

    <button type="submit" class="btn btn-primary w-100">Save</button>
    <a href="/showMyLoginPage" class="login-link"> Login</a>
  </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
<script>
  $(document).ready(function() {
    $('#password').on('input', function() {
      var password = $(this).val();
      var result = zxcvbn(password);
      var score = result.score;
      var $bar = $('#strengthBar');
      var classes = ['bg-danger', 'bg-danger', 'bg-warning', 'bg-info', 'bg-success'];
      $bar.css('width', (score + 1) * 20 + '%').attr('class', 'progress-bar ' + classes[score]);
    });

    $('#confirmPassword').on('input', function() {
      var password = $('#password').val();
      var confirmPassword = $(this).val();
      if (password !== confirmPassword) {
        $(this).addClass('is-invalid');
      } else {
        $(this).removeClass('is-invalid');
      }
    });
  });
</script>
</body>

</html>
