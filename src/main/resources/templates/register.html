<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Registration</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    /* Body background animation */
    body {
        background-color: #f8f9fa;
        animation: fadeIn 1.5s ease-in-out;
    }

    /* Container with fade-in animation */
    .container {
        max-width: 400px;
        margin-top: 50px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        animation: slideUp 1s ease-in-out;
    }

    /* Animation for form inputs */
    .form-control {
        transition: all 0.3s ease;
    }

    .form-control:focus {
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.6);
        border-color: #007bff;
    }

    /* Animation for button */
    .btn-primary {
        width: 100%;
        transition: transform 0.3s ease;
    }

    .btn-primary:hover {
        transform: scale(1.05);
    }

    /* Fade-in effect for the alerts */
    .alert {
        animation: fadeInAlert 1.5s ease-in-out;
    }

    /* Animation for text links */
    .text-primary {
        transition: color 0.3s ease;
    }

    .text-primary:hover {
        color: #ff6600;
    }

    /* Keyframe animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            transform: translateY(20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    @keyframes fadeInAlert {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
  </style>
</head>

<body>
<div class="container">
  <h3 class="text-center">User Registration</h3>
  <hr />
  <form autocomplete="off" th:action="@{/register}" th:object="${user}" method="post">

    <div th:if="${confirmationMessage}" class="alert alert-success" th:text="${confirmationMessage}"></div>
    <div th:if="${alreadyRegisteredMessage}" class="alert alert-danger" th:text="${alreadyRegisteredMessage}"></div>

    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" th:field="*{firstName}" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" th:field="*{lastName}" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Gender</label>
      <div class="form-check">
        <input type="radio" class="form-check-input" th:field="*{gender}" th:value="Male" />
        <label class="form-check-label">Male</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" th:field="*{gender}" th:value="Female" />
        <label class="form-check-label">Female</label>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <div class="text-center mt-3">
    <span>Already have an account? <a th:href="@{/showMyLoginPage}" class="text-primary">Log in</a></span>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
